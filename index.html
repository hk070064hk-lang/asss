<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromebook 負荷テスト（安全版）</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
         background:#111; color:#ddd; margin:0; padding:24px; line-height:1.6; }
  .panel { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 0 6px; }
  .warn { color:#e8a33d; font-size:12px; margin:0 0 18px; }
  fieldset { border:1px solid #2e2e2e; border-radius:8px; padding:10px 16px 14px; margin:0 0 14px; }
  legend { color:#8ab4f8; font-size:12px; padding:0 6px; }
  label { display:flex; justify-content:space-between; align-items:center;
          gap:12px; font-size:13px; padding:3px 0; }
  label span.hint { color:#777; font-size:11px; font-weight:normal; }
  input[type=number], select { width:130px; background:#1c1c1c; color:#eee;
          border:1px solid #444; border-radius:4px; padding:4px 6px; font-size:13px; }
  .row { display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  button { font-size:14px; padding:8px 18px; border-radius:6px; border:1px solid #444;
           background:#2a2a2a; color:#eee; cursor:pointer; }
  button.primary { background:#1a5cff; border-color:#1a5cff; }
  button.danger  { background:#8b1d1d; border-color:#8b1d1d; }
  button:disabled { opacity:.4; cursor:default; }
  .stats { display:grid; grid-template-columns:repeat(2,1fr); gap:4px 18px;
           font-size:12px; font-family:ui-monospace, monospace; margin-bottom:14px; }
  .stats b { color:#8ab4f8; font-weight:normal; }
  #log { font-family:ui-monospace, monospace; font-size:12px; background:#0a0a0a;
         border:1px solid #222; border-radius:6px; padding:10px; height:170px;
         overflow:auto; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="panel">
  <h1>Chromebook 負荷テスト（安全版・ローカル完結）</h1>
  <p class="warn">
    自分が管理する端末でのみ実行してください。外部サーバーへの通信は一切行いません
    （ダウンロード/アップロードはローカル Blob の読み書きでシミュレートしています）。
  </p>

  <fieldset>
    <legend>プリセット</legend>
    <div class="row">
      <select id="preset">
        <option value="極弱">極弱</option>
        <option value="弱" selected>弱</option>
        <option value="中">中</option>
        <option value="強">強</option>
      </select>
      <button id="startBtn" class="primary" type="button">開始</button>
      <button id="stopBtn" class="danger" type="button" disabled>停止</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>パラメータ（コード冒頭の CONFIG と同じ値）</legend>
    <div id="fields"></div>
  </fieldset>

  <div class="stats">
    <div>状態: <b id="stState">idle</b></div>
    <div>ラウンド: <b id="stRound">0 / 0</b></div>
    <div>FPS: <b id="stFps">-</b></div>
    <div>JS ヒープ: <b id="stHeap">-</b></div>
    <div>保持バッファ: <b id="stBuf">0 MB</b></div>
    <div>処理済み資産: <b id="stAssets">0</b></div>
    <div>ローカル I/O: <b id="stIo">0 MB</b></div>
    <div>経過: <b id="stTime">-</b></div>
  </div>

  <div id="log"></div>
</div>

<script>
/* ============================================================
 *  CONFIG — ここの数字を変えると強度が変わります
 * ============================================================ */
const CONFIG = {
  workers:            1,
  assetsPerRound:     5,
  trianglesPerAsset:  5000,
  allocMBPerRound:    4,
  maxRetainedMB:      256,
  rounds:             10,
  roundIntervalMs:    400,
  ioMB:               8,
  ioLoops:            3,
  autoStopFps:        10,
  autoStopHeapMB:     0,
};

const PRESETS = {
  '極弱': { workers:1, assetsPerRound:2,  trianglesPerAsset:3000,  allocMBPerRound:2,  rounds:5,  roundIntervalMs:600, ioMB:4,  ioLoops:1 },
  '弱':   { workers:1, assetsPerRound:5,  trianglesPerAsset:5000,  allocMBPerRound:4,  rounds:10, roundIntervalMs:400, ioMB:8,  ioLoops:3 },
  '中':   { workers:2, assetsPerRound:10, trianglesPerAsset:20000, allocMBPerRound:8,  rounds:20, roundIntervalMs:300, ioMB:16, ioLoops:4 },
  '強':   { workers:4, assetsPerRound:20, trianglesPerAsset:60000, allocMBPerRound:16, rounds:40, roundIntervalMs:200, ioMB:32, ioLoops:6 },
};

const LIMITS = {
  workers:           [1, 4],
  assetsPerRound:    [1, 50],
  trianglesPerAsset: [100, 100000],
  allocMBPerRound:   [1, 32],
  maxRetainedMB:     [32, 1024],
  rounds:            [1, 200],
  roundIntervalMs:   [100, 5000],
  ioMB:              [1, 64],
  ioLoops:           [0, 10],
  autoStopFps:       [0, 60],
  autoStopHeapMB:    [0, 4096],
};

const FIELDS = [
  ['workers',           'Worker 数'],
  ['assetsPerRound',    '1 ラウンドの 3D 資産数'],
  ['trianglesPerAsset', '1 資産の三角面数'],
  ['allocMBPerRound',   '1 ラウンドの確保メモリ (MB)'],
  ['maxRetainedMB',     '保持メモリ上限 (MB)'],
  ['rounds',            '総ラウンド数'],
  ['roundIntervalMs',   'ラウンド間隔 (ms)'],
  ['ioMB',              'ローカル I/O サイズ (MB)'],
  ['ioLoops',           'ローカル I/O 回数 / ラウンド'],
  ['autoStopFps',       '自動停止 FPS しきい値 (0=無効)'],
  ['autoStopHeapMB',    '自動停止 ヒープ上限 (0=無効)'],
];

const WORKER_SRC = `
self.onmessage = function (e) {
  const { triangles, assets } = e.data;
  let checksum = 0;
  for (let a = 0; a < assets; a++) {
    const verts = new Float32Array(triangles * 3);
    for (let i = 0; i < verts.length; i++) {
      verts[i] = Math.sin(i * 0.001) * Math.cos(i * 0.0007);
      checksum += verts[i];
    }
    const idx = new Uint32Array(triangles * 3);
    for (let i = 0; i < idx.length; i++) idx[i] = i % 65535;
    checksum += idx[0] || 0;
  }
  self.postMessage({ checksum: checksum, assets: assets });
};
`;

const state = {
  running: false,
  round: 0,
  workers: [],
  workerUrls: [],
  buffers: [],
  assetsDone: 0,
  ioDone: 0,
  roundTimer: null,
  startTime: 0,
  lowFpsStreak: 0,
  fps: 60,
};

const $ = (id) => document.getElementById(id);

function log(msg) {
  const el = $('log');
  const t = ((performance.now() - (state.startTime || performance.now())) / 1000).toFixed(1);
  el.textContent += `[${t}s] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

function heapMB() {
  return (performance && performance.memory)
    ? performance.memory.usedJSHeapSize / 1048576
    : NaN;
}

function retainedMB() {
  return state.buffers.reduce((s, b) => s + b.byteLength, 0) / 1048576;
}

function buildFields() {
  const box = $('fields');
  box.innerHTML = '';
  for (const [key, label] of FIELDS) {
    const el = document.createElement('label');
    const [lo, hi] = LIMITS[key];
    el.innerHTML = `<span>${label} <span class="hint">(${lo}–${hi})</span></span>`;
    const input = document.createElement('input');
    input.type = 'number';
    input.min = lo; input.max = hi; input.step = 1;
    input.value = CONFIG[key];
    input.dataset.key = key;
    input.addEventListener('input', () => {
      const v = Number(input.value);
      if (!Number.isFinite(v)) return;
      CONFIG[key] = clamp(Math.round(v), lo, hi);
    });
    el.appendChild(input);
    box.appendChild(el);
  }
}

function syncFields() {
  document.querySelectorAll('#fields input').forEach((input) => {
    input.value = CONFIG[input.dataset.key];
  });
}

function updateStats() {
  $('stState').textContent = state.running ? 'running' : 'idle';
  $('stRound').textContent = `${state.round} / ${CONFIG.rounds}`;
  $('stFps').textContent = state.running ? state.fps.toFixed(0) : '-';
  const h = heapMB();
  $('stHeap').textContent = Number.isNaN(h) ? 'N/A' : `${h.toFixed(1)} MB`;
  $('stBuf').textContent = `${retainedMB().toFixed(1)} MB`;
  $('stAssets').textContent = String(state.assetsDone);
  $('stIo').textContent = `${state.ioDone.toFixed(1)} MB`;
  $('stTime').textContent = state.running
    ? `${((performance.now() - state.startTime) / 1000).toFixed(1)} s`
    : '-';
}

/* ---- FPS 監視（自動停止の安全弁） ---- */
let rafFrames = 0;
let rafLast = performance.now();

function rafLoop(t) {
  if (!state.running) return;
  rafFrames++;
  if (t - rafLast >= 500) {
    state.fps = (rafFrames * 1000) / (t - rafLast);
    rafFrames = 0;
    rafLast = t;
    checkAutoStop();
    updateStats();
  }
  requestAnimationFrame(rafLoop);
}

function checkAutoStop() {
  if (!state.running) return;
  if (CONFIG.autoStopFps > 0) {
    if (state.fps < CONFIG.autoStopFps) state.lowFpsStreak++;
    else state.lowFpsStreak = 0;
    if (state.lowFpsStreak >= 4) {
      stopTest(`自動停止：FPS が ${CONFIG.autoStopFps} を下回りました（${state.fps.toFixed(1)}）`);
      return;
    }
  }
  const h = heapMB();
  if (CONFIG.autoStopHeapMB > 0 && !Number.isNaN(h) && h > CONFIG.autoStopHeapMB) {
    stopTest(`自動停止：JS ヒープが ${CONFIG.autoStopHeapMB} MB を超えました`);
  }
}

/* ---- ローカル I/O（ダウンロード/アップロード相当） ---- */
async function localIO() {
  const bytes = new Uint8Array(CONFIG.ioMB * 1048576);
  for (let i = 0; i < bytes.length; i += 4096) bytes[i] = i & 0xff;
  const blob = new Blob([bytes]);
  const down = await blob.arrayBuffer();
  const up = await new Response(blob).arrayBuffer();
  return (down.byteLength + up.byteLength) / 1048576;
}

/* ---- 常駐バッファ確保 ---- */
function allocChunk() {
  const buf = new ArrayBuffer(CONFIG.allocMBPerRound * 1048576);
  new Uint8Array(buf).fill(1);
  state.buffers.push(buf);
  const maxBytes = CONFIG.maxRetainedMB * 1048576;
  let total = state.buffers.reduce((s, b) => s + b.byteLength, 0);
  while (total > maxBytes && state.buffers.length > 1) {
    total -= state.buffers.shift().byteLength;
  }
}

/* ---- Worker 生成（失敗したら null を返す） ---- */
function makeWorker() {
  try {
    const blob = new Blob([WORKER_SRC], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    const w = new Worker(url);
    w.onmessage = (e) => {
      state.assetsDone += e.data.assets;
      updateStats();
    };
    w.onerror = (e) => {
      log(`Worker エラー: ${e.message || 'unknown'}`);
    };
    state.workerUrls.push(url);
    return w;
  } catch (err) {
    log(`Worker 作成失敗: ${err.message}。3D 計算はスキップします（メモリと I/O のみ）。`);
    return null;
  }
}

/* ---- 開始 / 停止 ---- */
function startTest() {
  if (state.running) return;
  try {
    state.running = true;
    state.round = 0;
    state.assetsDone = 0;
    state.ioDone = 0;
    state.lowFpsStreak = 0;
    state.fps = 60;
    state.buffers = [];
    state.startTime = performance.now();
    $('log').textContent = '';

    if (location.protocol === 'file:') {
      log('注意: file:// で開いています。ブラウザによっては Worker が使えないため、' +
          'その場合は 3D 計算をスキップして動作します。');
    }

    log(`開始: workers=${CONFIG.workers} assets/round=${CONFIG.assetsPerRound} ` +
        `tri/asset=${CONFIG.trianglesPerAsset} alloc=${CONFIG.allocMBPerRound}MB ` +
        `rounds=${CONFIG.rounds}`);

    for (let i = 0; i < CONFIG.workers; i++) {
      const w = makeWorker();
      if (w) state.workers.push(w);
    }

    $('startBtn').disabled = true;
    $('stopBtn').disabled = false;
    $('preset').disabled = true;
    document.querySelectorAll('#fields input').forEach((i) => (i.disabled = true));

    rafFrames = 0;
    rafLast = performance.now();
    requestAnimationFrame(rafLoop);

    tick();
  } catch (err) {
    log(`開始時エラー: ${err.message}`);
    stopTest('開始時エラー');
  }
}

function stopTest(reason) {
  if (!state.running) return;
  state.running = false;

  if (state.roundTimer) { clearTimeout(state.roundTimer); state.roundTimer = null; }
  state.workers.forEach((w) => { try { w.terminate(); } catch (_) {} });
  state.workers = [];
  state.workerUrls.forEach((u) => { try { URL.revokeObjectURL(u); } catch (_) {} });
  state.workerUrls = [];
  state.buffers = [];

  $('startBtn').disabled = false;
  $('stopBtn').disabled = true;
  $('preset').disabled = false;
  document.querySelectorAll('#fields input').forEach((i) => (i.disabled = false));

  log(`停止: ${reason || '手動'}`);
  updateStats();
}

async function tick() {
  if (!state.running) return;
  if (state.round >= CONFIG.rounds) { stopTest('全ラウンド完了'); return; }

  state.round++;
  log(`--- ラウンド ${state.round} / ${CONFIG.rounds} ---`);

  allocChunk();

  const per = Math.max(1, Math.ceil(CONFIG.assetsPerRound / Math.max(1, state.workers.length)));
  state.workers.forEach((w) => {
    w.postMessage({ triangles: CONFIG.trianglesPerAsset, assets: per });
  });

  if (CONFIG.ioLoops > 0) {
    try {
      for (let i = 0; i < CONFIG.ioLoops && state.running; i++) {
        state.ioDone += await localIO();
      }
    } catch (err) {
      log(`ローカル I/O エラー: ${err.message}`);
    }
  }

  updateStats();
  if (!state.running) return;
  state.roundTimer = setTimeout(tick, CONFIG.roundIntervalMs);
}

/* ---- イベント ---- */
$('preset').addEventListener('change', (e) => {
  const p = PRESETS[e.target.value];
  if (!p) return;
  Object.assign(CONFIG, p);
  syncFields();
});

$('startBtn').addEventListener('click', startTest);
$('stopBtn').addEventListener('click', () => stopTest('手動'));

// タブ離脱時は確実に停止（stopTest に改名したので window.stop と衝突しない）
window.addEventListener('pagehide', () => stopTest('ページ離脱'));
window.addEventListener('beforeunload', () => stopTest('ページ離脱'));

/* ---- 初期化 ---- */
buildFields();
updateStats();
$('startBtn').disabled = false;
$('stopBtn').disabled = true;
log('準備完了。「開始」を押してください。');
</script>
</body>
</html>
